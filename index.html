<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Scheda di allenamento che si adatta ogni giorno a come stai.">
<meta name="theme-color" content="#2350D0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scheda Viva">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Scheda Viva</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout: colonna unica da app (max 620px), barra schede in basso. Un solo carattere (Archivo) usato in due larghezze:
   largo e pesante per titoli e numeri, normale per il testo. L'unico gesto forte è il bilanciere caricato della prontezza. */
:root{
  --bg:#F1F3F0; --surface:#FFFFFF; --sunk:#E6EAE5; --ink:#191C1A; --muted:#5C655F; --line:#D6DCD5;
  --accent:#2350D0; --accent-ink:#FFFFFF; --accent-soft:#E0E7FB;
  --go:#1E8A50; --go-soft:#DFF1E6; --warn:#946A00; --warn-soft:#F8EDCB; --stop:#C4342C; --stop-soft:#F9E1DE;
  --work:#D9412A;
  --p25:#D7322C; --p20:#2457D6; --p15:#E8B90F; --p10:#24924F; --p5:#F4F4F2; --p2:#9AA3AE; --steel:#8E978F;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131513; --surface:#1B1E1B; --sunk:#242824; --ink:#E8ECE8; --muted:#9AA39C; --line:#2E332E;
  --accent:#7C9BFF; --accent-ink:#0E1430; --accent-soft:#1F2A4C;
  --go:#57C78B; --go-soft:#173222; --warn:#E6B940; --warn-soft:#352F10; --stop:#F27A70; --stop-soft:#3C1A17;
  --p5:#D9DCDF; --steel:#6E776F; --work:#F06A4E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131513; --surface:#1B1E1B; --sunk:#242824; --ink:#E8ECE8; --muted:#9AA39C; --line:#2E332E;
  --accent:#7C9BFF; --accent-ink:#0E1430; --accent-soft:#1F2A4C;
  --go:#57C78B; --go-soft:#173222; --warn:#E6B940; --warn-soft:#352F10; --stop:#F27A70; --stop-soft:#3C1A17;
  --p5:#D9DCDF; --steel:#6E776F; --work:#F06A4E; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15.5px;line-height:1.5;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:620px;margin:0 auto}
h1,h2,h3{font-family:var(--f);line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:2.15rem;font-weight:850;font-stretch:125%;letter-spacing:-.015em}
h2{font-size:1.45rem;font-weight:800;font-stretch:118%;letter-spacing:-.01em}
h3{font-size:1.08rem;font-weight:750;font-stretch:112%}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.87rem}
.mono,.num{font-variant-numeric:tabular-nums}
.label{font-size:.86rem;font-weight:500;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:26px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px}
.brand b{white-space:nowrap;font-size:1.15rem;font-weight:850;font-stretch:125%;letter-spacing:-.01em}
.brand-mark{width:22px;height:22px;border-radius:50%;border:4px solid var(--accent);position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--sunk);color:var(--muted)}
.pill.go{background:var(--go-soft);color:var(--go)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.stop{background:var(--stop-soft);color:var(--stop)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.panel{background:var(--sunk);border-radius:var(--r);padding:14px 16px}
.divide>*+*{border-top:1px solid var(--line)}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:650;background:var(--sunk);color:var(--ink);transition:transform .08s ease,background .15s ease}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-within,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-ink);font-stretch:110%;font-weight:750}
.btn-ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn-sm{padding:7px 12px;font-size:.84rem;border-radius:9px}
.btn-danger{background:var(--stop-soft);color:var(--stop)}
.btn-wide{width:100%}
button[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>span{font-weight:600;font-size:.92rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:inline-block;padding:8px 14px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:.9rem}
.chip input:checked+span{background:var(--ink);color:var(--bg);box-shadow:none}
.scale5{display:flex;flex-direction:column;gap:5px}
.scale5 .dots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale5 .chip{display:block}
.scale5 .chip span{display:block;width:100%;text-align:center;padding:9px 0;border-radius:10px;font-weight:750;font-stretch:115%}
.scale5 .chip input:checked+span{background:var(--accent);color:var(--accent-ink)}
.scale5 .ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);box-shadow:0 -1px 0 var(--line);
  padding:4px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 5px;color:var(--muted);text-decoration:none;font-size:.74rem;font-weight:600}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.today-head{display:flex;flex-direction:column;gap:6px}
.coach{background:var(--sunk);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.coach b{font-size:1rem;font-weight:750;font-stretch:112%}
.ex{padding:15px 0;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.ex-name{font-weight:700;font-size:1.03rem}
.rx{display:flex;flex-direction:column;gap:2px}
.rxb{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rxb-main{font-weight:850;font-stretch:125%;font-size:1.05rem}
.rxb-load{font-weight:700;color:var(--accent)}
.rxb-load.none{color:var(--muted);font-weight:500}
.rxb-meta{font-size:.82rem;color:var(--muted)}
.sess-list{counter-reset:ex}
.sess-row{display:grid;grid-template-columns:26px minmax(0,1fr);gap:2px 8px;padding:11px 0;align-items:baseline}
.sess-row::before{counter-increment:ex;content:counter(ex);font-weight:800;font-stretch:125%;color:var(--muted);grid-row:span 2}
.sets{display:grid;grid-template-columns:24px repeat(3,minmax(0,1fr)) 46px;gap:6px;align-items:center}
.sets .h{font-size:.74rem;color:var(--muted);font-weight:600;text-align:center}
.sets input{padding:9px 4px;text-align:center;font-weight:600}
.sets .n{font-weight:800;font-stretch:125%;color:var(--muted);text-align:center}
.tick{width:46px;height:42px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;padding:0;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--go);color:var(--surface)}
.plates{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
.plate{display:inline-block;width:7px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.bar-wrap{display:flex;flex-direction:column;gap:6px}
.barbell{width:100%;height:auto;display:block;max-width:420px;margin:0 auto}
.log-head+.bar-wrap .barbell{max-width:250px}
.zone-go{color:var(--go)} .zone-warn{color:var(--warn)} .zone-stop{color:var(--stop)}
.banner{border-radius:var(--r);padding:13px 15px;font-size:.92rem;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft)} .banner.warn b{color:var(--warn)}
.banner.stop{background:var(--stop-soft)} .banner.stop b{color:var(--stop)}
.banner.acc{background:var(--accent-soft)}
.change{display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 10px;padding:11px 0}
.change .k{font-size:.8rem;color:var(--accent);font-weight:700;padding-top:2px}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:2rem;font-weight:850;font-stretch:125%;line-height:1}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.1}
.chart .dot{fill:var(--accent)}
.vol{display:grid;grid-template-columns:96px minmax(0,1fr) 36px;gap:8px;align-items:center;font-size:.88rem}
.vol .bar{position:relative;height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.vol .band{position:absolute;top:0;bottom:0;background:var(--go-soft)}
.vol .fill{position:absolute;left:0;top:3px;bottom:3px;background:var(--accent);border-radius:3px}
.timer{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.timer .in{background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.timer b{font-stretch:125%;font-size:1.15rem}
.timer button{background:var(--bg);color:var(--ink)}
details summary{cursor:pointer;font-weight:600}
.src{font-size:.88rem;padding:11px 0}
.src a{color:var(--accent);word-break:break-all}
.proposal{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:11px 0;align-items:start}
.proposal input{width:20px;height:20px;margin-top:3px}
.empty{padding:26px 16px;text-align:center;border-radius:var(--r);background:var(--sunk)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px)}
@keyframes load-plate{from{transform:scaleY(.2);opacity:0}to{transform:none;opacity:1}}
.barbell .pl{transform-box:fill-box;transform-origin:center;animation:load-plate .45s cubic-bezier(.3,1.4,.5,1) both}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Figure animate */
.fx{display:block;width:100%;height:auto}
.fx .fx-ground{stroke:var(--line);stroke-width:2}
.fx .fx-prop{fill:var(--sunk);stroke:var(--line);stroke-width:1.5}
.fx .fx-prop-l{stroke:var(--line);stroke-linecap:round}
.fx .fx-cable{stroke:var(--muted);stroke-dasharray:3 3}
.fx .fx-b{fill:var(--ink)}
.fx .fx-far .fx-b{fill:var(--muted);opacity:.42}
.fx .fx-head{fill:var(--ink)}
.fx .fx-hand{fill:var(--ink)}
.fx .fx-eye{fill:var(--sunk)}
.fx .fx-work{fill:var(--work)}
.fx .fx-work-far{opacity:.45}
.fx .fx-trace{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:2 5;stroke-linecap:round;opacity:.55}
.fx .fx-shadow{fill:var(--ink);opacity:.07}
.fx .fx-plate{fill:var(--accent)}
.fx .fx-plate-l{stroke:var(--accent);stroke-linecap:round}
.fx .fx-hub{fill:var(--surface)}
.fx-thumb{width:52px;flex:none;background:var(--sunk);border-radius:10px;padding:3px}
.fx-cap{position:absolute;left:10px;top:8px;right:10px;font-size:.8rem;font-weight:650;color:var(--ink);text-align:left;pointer-events:none;min-height:1.2em}
.lg-work,.lg-trace{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--work);vertical-align:-1px;margin-right:3px}
.lg-trace{background:none;border-top:2px dashed var(--accent);height:0;border-radius:0;width:16px;vertical-align:3px}
.fx-stage{position:relative;display:block;width:100%;background:var(--sunk);border-radius:var(--r);padding:8px 8px 4px}
.fx-big{max-height:42vh;margin:0 auto}
canvas.fx3{display:block;width:100%;aspect-ratio:220/196;margin:0 auto;border-radius:10px}
.fx-stage.has3d{background:radial-gradient(ellipse at 50% 38%, var(--surface) 0%, var(--surface) 35%, var(--sunk) 100%)}
img.fx-img{display:block;object-fit:contain;background:var(--surface)}
img.fx-thumb{width:56px;height:50px;flex:none;border-radius:10px;padding:2px;box-shadow:inset 0 0 0 1px var(--line)}
canvas.fx3.fx-big{max-height:44vh;width:auto;max-width:100%}
canvas.fx3.fx-mid{max-height:28vh;width:auto;max-width:100%}
.fx-mid{max-height:24vh;margin:0 auto}
button.fx-tap{border-radius:var(--r)}
.fx-hint{position:absolute;right:10px;bottom:8px;font-size:.74rem;font-weight:600;color:var(--muted);background:var(--surface);padding:3px 8px;border-radius:999px}
/* Righe esercizio */
.exrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;padding:10px 0;border-radius:0;font-weight:400}
.exrow:active{transform:none;background:var(--sunk)}
.exrow-body{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.exrow-name{font-weight:650}
.exrow-more{font-size:.76rem;color:var(--accent);font-weight:650;white-space:nowrap}
.planrow{display:flex;align-items:center;gap:8px}
.planrow .exrow{flex:1;min-width:0}
.planrow .exrow-more{display:none}
details.changes>summary{display:flex;align-items:center;gap:10px;list-style:none}
details.changes>summary::-webkit-details-marker{display:none}
details.changes>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;transition:transform .2s}
details.changes[open]>summary::after{transform:rotate(-135deg)}
/* Seduta guidata */
.log-head{display:flex;flex-direction:column;gap:12px}
.prog{display:flex;gap:5px}
.prog button{flex:1;height:8px;padding:0;border-radius:4px;background:var(--line)}
.prog button.ok{background:var(--go)}
.prog button.cur{background:var(--accent)}
.ex-focus{display:flex;flex-direction:column;gap:14px}
.ex-focus .sets{grid-template-columns:40px repeat(3,minmax(0,1fr)) 50px}
.ex-focus .sets input{height:46px;font-size:1.05rem}
.ex-focus .tick{width:50px;height:46px}
.log-nav{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:10px}
.log-nav .btn-primary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Scheda tecnica */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(10,14,12,.45);opacity:0;transition:opacity .28s ease}
.sheet-card{position:relative;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);outline:none}
.sheet.open .sheet-bg{opacity:1}
.sheet.open .sheet-card{transform:none}
.sheet-grip{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
ol.how{margin:0;padding:0;list-style:none;counter-reset:how;display:flex;flex-direction:column;gap:12px}
ol.how li{counter-increment:how;display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 10px}
ol.how li::before{content:counter(how);grid-row:span 2;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.yt{display:block;text-align:center;padding:12px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-weight:650;text-decoration:none}

/* Apertura */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .45s cubic-bezier(.4,0,.2,1)}
#splash.out .sp-in{transform:scale(.96) translateY(-8px)}
.sp-bar{width:min(240px,64vw)}
.sp-rod{fill:var(--steel);transform-origin:center;animation:sp-rod .5s cubic-bezier(.2,.8,.2,1) both}
.sp-pl{fill:var(--accent);transform-box:fill-box;transform-origin:center;animation:sp-plate .42s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(.25s + var(--d)*.12s)}
.sp-pl2{opacity:.75}
.sp-name{font-size:1.9rem;font-weight:850;font-stretch:125%;letter-spacing:-.015em;animation:sp-up .5s .5s cubic-bezier(.2,.8,.2,1) both}
.sp-tag{color:var(--muted);font-size:.95rem;animation:sp-up .5s .62s cubic-bezier(.2,.8,.2,1) both}
@keyframes sp-rod{from{transform:scaleX(0)}}
@keyframes sp-plate{from{transform:scaleY(.1);opacity:0}}
@keyframes sp-up{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){#splash{display:none}}

/* Libreria esercizi */
.segm{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.segm button{background:transparent;padding:10px;border-radius:9px;font-weight:650;color:var(--muted)}
.segm button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lib-chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.lib-chips button{white-space:nowrap}
.lib-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lib-card{display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:0;padding:0;border-radius:var(--r);background:var(--surface);box-shadow:0 0 0 1px var(--line);overflow:hidden;font-weight:400}
.lib-media{display:block;background:radial-gradient(ellipse at 50% 40%, var(--surface), var(--sunk))}
.lib-media .fx-lib{width:100%;height:auto;aspect-ratio:264/236;padding:0;border-radius:0;box-shadow:none;background:transparent}

/* Transizioni tra viste */
#view{view-transition-name:view}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(view){animation:none}
::view-transition-old(view){animation:vt-fade-out .14s cubic-bezier(.4,0,1,1) both}
::view-transition-new(view){animation:vt-fade-in .42s cubic-bezier(.16,1,.3,1) .04s both}
html[data-vt="next"]::view-transition-old(view){animation:vt-out-l .18s cubic-bezier(.4,0,1,1) both}
html[data-vt="next"]::view-transition-new(view){animation:vt-in-r .44s cubic-bezier(.16,1,.3,1) both}
html[data-vt="prev"]::view-transition-old(view){animation:vt-out-r .18s cubic-bezier(.4,0,1,1) both}
html[data-vt="prev"]::view-transition-new(view){animation:vt-in-l .44s cubic-bezier(.16,1,.3,1) both}
@keyframes vt-fade-in{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes vt-fade-out{to{opacity:0;transform:scale(.99)}}
@keyframes vt-out-l{to{opacity:0;transform:translateX(-18%)}}
@keyframes vt-in-r{from{opacity:0;transform:translateX(22%)}}
@keyframes vt-out-r{to{opacity:0;transform:translateX(18%)}}
@keyframes vt-in-l{from{opacity:0;transform:translateX(-22%)}}
@media (prefers-reduced-motion:reduce){.sheet-card,.sheet-bg{transition:none}}

  squat:["Bilanciere sulla parte alta della schiena, mani poco più larghe delle spalle, piedi a larghezza spalle con le punte un po' aperte.","Inspira, porta il bacino indietro e in basso come per sederti, con le ginocchia che seguono le punte. Risali spingendo il pavimento.","Talloni che si staccano o ginocchia che collassano verso l'interno: riduci il carico e la profondità finché restano stabili."],
  goblet:["Tieni il manubrio in verticale contro il petto, gomiti stretti, piedi a larghezza spalle.","Scendi tra le ginocchia mantenendo il busto alto, poi risali spingendo dai talloni.","Arrotondare la schiena in basso: scendi solo fin dove resta neutra."],
  boxsquat:["In piedi davanti a una panca o una sedia, braccia avanti per bilanciarti.","Siediti appena sulla panca senza rilassarti, poi rialzati spingendo dai talloni.","Lasciarsi cadere sulla panca: la discesa deve essere controllata."],
  legpress:["Schiena e bacino appoggiati, piedi al centro della pedana a larghezza spalle.","Fai scendere la pedana finché le ginocchia arrivano verso il petto, poi spingi senza bloccare le ginocchia.","Bacino che si stacca dal sedile in basso: è il segnale per fermarsi prima."],
  hinge:["In piedi, bilanciere davanti alle cosce, ginocchia morbide, schiena neutra.","Spingi il bacino indietro facendo scorrere il bilanciere lungo le gambe finché senti tirare i femorali, poi risali contraendo i glutei.","Piegare la schiena invece delle anche: il movimento parte dal bacino."],
  hinge_db:["In piedi, manubri davanti alle cosce, ginocchia morbide, schiena neutra.","Spingi il bacino indietro facendo scendere i manubri lungo le gambe, poi risali contraendo i glutei.","Manubri lontani dal corpo: tienili vicini alle gambe."],
  deadlift:["Dentro la trap bar, piedi a larghezza anche, afferra le maniglie con le braccia tese.","Petto alto, spingi il pavimento e alzati insieme con anche e ginocchia. Scendi con lo stesso percorso.","Strattonare il carico da terra: metti in tensione le braccia prima di spingere."],
  thrust:["Scapole appoggiate al bordo della panca, bilanciere sulle anche con un'imbottitura, piedi a terra.","Spingi dai talloni fino ad allineare spalle, anche e ginocchia, tieni un secondo e scendi.","Inarcare la schiena in alto: guarda in avanti e chiudi le costole."],
  bridge:["Sdraiato a pancia in su, un piede a terra vicino ai glutei, l'altra gamba distesa.","Spingi dal tallone e solleva il bacino finché il corpo forma una linea, poi scendi lentamente.","Bacino che ruota da un lato: tienilo parallelo al pavimento."],
  lunge:["In piedi, manubri lungo i fianchi, busto dritto.","Fai un passo ampio indietro e scendi finché il ginocchio posteriore sfiora il pavimento, poi torna su spingendo con la gamba davanti.","Ginocchio davanti che crolla verso l'interno: tienilo in linea con il piede."],
  stepup:["Davanti a una panca stabile all'altezza del ginocchio, un piede sopra tutto appoggiato.","Sali spingendo con la gamba sopra fino a stenderla, poi scendi lentamente.","Darsi lo slancio con il piede a terra: deve lavorare la gamba sul rialzo."],
  bss:["Collo del piede posteriore su una panca, piede anteriore circa un passo avanti.","Scendi in verticale finché la coscia anteriore è quasi parallela, poi risali.","Piede anteriore troppo vicino alla panca: fai un piccolo passo in più in avanti."],
  bench:["Sdraiato sulla panca, occhi sotto il bilanciere, scapole strette e piedi ben piantati a terra.","Porta il bilanciere al basso petto con i gomiti a 45–70°, poi spingi verso l'alto.","Far rimbalzare il bilanciere sul petto o staccare il sedere dalla panca."],
  bench_db:["Sdraiato sulla panca con un manubrio per mano sopra il petto, scapole strette.","Scendi controllato finché senti allungare il petto, poi spingi su avvicinando i manubri.","Gomiti completamente aperti a 90°: tienili un po' più chiusi per proteggere le spalle."],
  incline:["Panca inclinata a circa 30°, manubri sopra il petto, scapole indietro.","Scendi fino a sentire l'allungamento della parte alta del petto, poi spingi in alto.","Inclinazione troppo alta: oltre 45° diventa un esercizio per le spalle."],
  chestpress:["Regola il sedile in modo che le maniglie siano all'altezza del petto, schiena appoggiata.","Spingi in avanti fino a quasi stendere le braccia, poi torna indietro lentamente.","Staccare le spalle dallo schienale per spingere di più."],
  pushup:["Mani poco più larghe delle spalle, corpo in linea dalla testa ai talloni.","Scendi con il petto verso terra e i gomiti a 45°, poi spingi via il pavimento. Per iniziare appoggia le mani su un rialzo.","Bacino che cede verso il basso: contrai addominali e glutei."],
  ohp:["In piedi o seduto, manubri all'altezza delle spalle, glutei e addominali contratti.","Spingi sopra la testa fino a stendere le braccia, poi scendi controllato.","Inarcare la schiena per spingere: riduci il carico."],
  landmine:["Un capo del bilanciere fissato a terra davanti a te, l'altro tenuto all'altezza della spalla.","Spingi in diagonale in avanti e in alto fino a stendere il braccio, poi torna alla spalla.","Ruotare il busto per aiutarti: deve muoversi solo il braccio."],
  pike:["Mani a terra, bacino alto, il corpo forma una V rovesciata.","Piega i gomiti portando la testa verso il pavimento tra le mani, poi spingi su.","Bacino che si abbassa: tienilo alto per caricare le spalle."],
  latpd:["Seduto con le cosce sotto il cuscinetto, presa poco più larga delle spalle.","Petto in alto, porta la sbarra verso la parte alta del petto guidando con i gomiti, poi risali lento.","Tirare dietro la nuca o dondolare con il busto."],
  pullup:["Appeso alla sbarra con le braccia tese, presa poco più larga delle spalle.","Tira i gomiti verso i fianchi finché il mento supera la sbarra, poi scendi controllato. Per iniziare usa un elastico o fai solo la discesa lenta.","Mezze ripetizioni: parti sempre da braccia distese."],
  pullover:["Sdraiato sulla panca, un manubrio tenuto con due mani sopra il petto.","Porta il manubrio dietro la testa con i gomiti morbidi finché senti allungare dorsali e petto, poi torna su.","Scendere troppo se la spalla dà fastidio: fermati dove è comodo."],
  rowcs:["Petto appoggiato su una panca inclinata, manubri che pendono a braccia tese.","Tira i gomiti indietro verso i fianchi stringendo le scapole, poi scendi lento.","Staccare il petto dalla panca per tirare di più."],
  cablerow:["Seduto con i piedi sulla pedana, ginocchia morbide, schiena dritta.","Tira la maniglia verso l'ombelico portando indietro i gomiti, poi allunga in avanti lasciando andare le scapole.","Dondolare con il busto per muovere il peso."],
  rowdb:["Mano e ginocchio su una panca, schiena piatta, manubrio a braccio teso.","Tira il gomito verso l'anca, tieni un attimo e scendi lento.","Ruotare il busto per sollevare: il busto resta fermo."],
  invrow:["Sdraiato sotto una sbarra bassa o un tavolo robusto, corpo dritto e talloni a terra.","Tira il petto verso la sbarra stringendo le scapole, poi scendi controllato.","Bacino che cede: corpo rigido come in un plank."],
  pallof:["Di fianco al cavo o all'elastico, maniglia al petto con due mani.","Spingi le braccia in avanti e resisti alla rotazione per due secondi, poi riporta al petto.","Lasciarsi ruotare verso il cavo: il busto resta frontale."],
  deadbug:["Sdraiato sulla schiena, braccia verso il soffitto, anche e ginocchia a 90°.","Allunga lentamente un braccio dietro la testa e la gamba opposta in avanti, poi torna e cambia lato.","Zona lombare che si stacca dal pavimento: riduci l'ampiezza."],
  plank:["Avambracci a terra, gomiti sotto le spalle, gambe distese.","Tieni il corpo in linea respirando normalmente per il tempo indicato.","Bacino troppo alto o troppo basso: guarda il pavimento e contrai i glutei."],
  birddog:["A quattro zampe, mani sotto le spalle e ginocchia sotto le anche.","Allunga un braccio in avanti e la gamba opposta indietro, tieni due secondi e torna. Alterna i lati.","Ruotare il bacino quando sollevi la gamba: muoviti lentamente."],
  farmer:["Prendi i manubri da terra piegando le gambe, poi alzati con le spalle basse.","Cammina a passi corti e controllati per la distanza indicata, poi posa i pesi.","Spalle che salgono verso le orecchie o busto che si piega di lato."],
  walk:["Scegli un'attività che puoi sostenere: camminata veloce, bici o cyclette.","Mantieni un ritmo in cui riesci ancora a parlare a frasi intere. Negli intervalli alterna 30 secondi forte e 30 piano.","Partire troppo forte: i primi minuti sono di riscaldamento."],
  curl:["In piedi, manubri lungo i fianchi, gomiti vicini al corpo.","Piega i gomiti portando i manubri verso le spalle, poi scendi lentamente.","Dondolare con la schiena per sollevare: riduci il peso."],
  cablecurl:["Davanti al cavo basso, maniglia in mano, gomiti ai fianchi.","Piega i gomiti verso le spalle mantenendo la tensione, poi scendi lento.","Gomiti che vanno avanti: restano fermi ai fianchi."],
  pushdown:["Davanti al cavo alto, maniglia o corda in mano, gomiti incollati ai fianchi.","Spingi verso il basso fino a stendere le braccia, poi risali fino a 90°.","Gomiti che si aprono o salgono: è il tricipite che deve lavorare."],
  french:["Seduto o in piedi, un manubrio tenuto con due mani sopra la testa.","Piega i gomiti portando il manubrio dietro la testa, poi stendi le braccia.","Gomiti che si allargano molto: tienili puntati in alto."],
  latraise:["In piedi, manubri lungo i fianchi, leggera inclinazione in avanti. (La figura è vista di lato: le braccia salgono ai lati del corpo.)","Solleva le braccia lateralmente fino all'altezza delle spalle, poi scendi lento.","Usare pesi troppo alti e dare slancio: qui contano leggerezza e controllo."],
  facepull:["Davanti al cavo alto con la corda, braccia tese in avanti.","Tira la corda verso la fronte portando i gomiti in alto e ruotando le mani verso l'esterno.","Tirare verso il petto: la corda va verso il viso."],
  rearfly:["Busto inclinato in avanti a schiena piatta, manubri sotto le spalle.","Apri le braccia di lato guidando con i gomiti fino all'altezza delle spalle, poi scendi.","Stringere troppo le scapole: devono lavorare i deltoidi posteriori."],
  calf:["In piedi con l'avampiede su un gradino, talloni liberi.","Sali sulle punte il più in alto possibile, tieni un secondo, poi scendi sotto il livello del gradino.","Rimbalzare in basso: fai una pausa per sentire l'allungamento."],

/* Anteprime 3D: un fotogramma fermo per esercizio, generato una volta e tenuto in memoria */
const THUMBS = new Map(); let thumbQ = [], thumbBusy = false;
function thumb3D(id){
  const key = ANIM_OF[id] || "walk";
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg"); svg.dataset.anim = key; svg.dataset.ex = id;
  const v = make3D(svg, {thumb:1, az:(CAM_OF[key] ?? 34)}); if (!v) return null;
  const J = poseAt(key, ECC.has(key) ? 0.8 : 0.9); v.update(J, 0, true);
  let url = null; try { url = v.canvas.toDataURL("image/png"); } catch(e){}
  v.dispose(); return url;
}
function hydrateThumbs(){
  if (!window.THREE) return;
  document.querySelectorAll("svg.fx-thumb[data-th]").forEach(el => {
    const id = el.dataset.th;
    if (THUMBS.get(id)){ const img = new Image(); img.src = THUMBS.get(id); img.alt = ""; img.className = el.getAttribute("class").replace("fx ","") + " fx-img"; el.replaceWith(img); }
    else if (!THUMBS.has(id) && !thumbQ.includes(id)) thumbQ.push(id);
  });
  if (!thumbBusy && thumbQ.length){ thumbBusy = true;
    const step = () => { const id = thumbQ.shift(); if (!id){ thumbBusy = false; return; }
      THUMBS.set(id, thumb3D(id) || ""); document.querySelectorAll(`svg.fx-thumb[data-th="${id}"]`).forEach(el => { const u = THUMBS.get(id); if (!u) return; const img = new Image(); img.src = u; img.alt = ""; img.className = el.getAttribute("class").replace("fx ","") + " fx-img"; el.replaceWith(img); });
      (window.requestIdleCallback || (f => setTimeout(f, 30)))(step); };
    setTimeout(step, 60); }
}

/* ================= Transizioni tra viste ================= */
function vt(fn, dir){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!document.startViewTransition || reduce){ fn(); return; }
  document.documentElement.dataset.vt = dir || "fade";
  try { const t = document.startViewTransition(fn); t.finished.finally(() => { delete document.documentElement.dataset.vt; }); }
  catch(e){ fn(); delete document.documentElement.dataset.vt; }
}

/* ================= Stato ================= */
let S = null;              // stato persistente (profilo, piano, corpo, bozza)
let SESS = [];             // sedute registrate, dalla più recente
const ui = {route:"oggi", ob:null, step:0, toast:null, claude:null, sample:null, downloads:null, demo:false, summary:null, timer:null, rdForm:null};

function blankProfile(){
  return {name:"", sex:"M", age:30, height:175, weight:75, waist:"", level:"principiante", goal:"ipertrofia",
    days:3, weekdays:[1,3,5], duration:60, equip:"gym", limits:[],
    nutrition:{has:"no", phase:"mant", kcal:"", protein:""},

/* ================= Prescrizione ================= */
function unitOf(id){ const L=LIB[id]; if (L.unit) return L.unit; return (S && S.profile.equip==="bw") ? "bw" : "kg"; }
function rx(id, p){
  const L = LIB[id], u = unitOf(id);
  if (L.t==="cardio") return id==="z2" ? {sets:1,rl:15,rh:25,rir:3,rest:0} : {sets:1,rl:8,rh:12,rir:2,rest:0};
  if (u==="s") return {sets: p.level==="principiante"?2:3, rl:25, rh:45, rir:2, rest:60};
  if (L.rlab==="passi") return {sets:3, rl:20, rh:30, rir:2, rest:75};
  const T = {forza:{c:[4,6,2,180],i:[8,12,2,90]}, ipertrofia:{c:[6,10,2,120],i:[10,15,1,75]},
    ricomposizione:{c:[8,12,2,90],i:[10,15,2,60]}, salute:{c:[8,12,3,90],i:[10,15,2,60]}, resistenza:{c:[12,15,3,60],i:[15,20,2,45]}}[p.goal][L.t==="c"?"c":"i"];
  let [rl,rh,rir,rest] = T, sets = L.t==="c" ? 3 : 2;
  if (p.level==="principiante"){ rir += 1; if (rl<6){ rl=6; rh=8; } }
  if (p.level==="avanzato" && L.t==="c") sets = 4;
  if (p.level==="intermedio" && L.t==="i") sets = 3;
  if (u==="bw"){ rl = Math.max(rl,6); rh = Math.max(rh, rl+4); }
  if (p.parq.some(Boolean)) rir = Math.max(rir, 3);
  return {sets, rl, rh, rir, rest};
}
function available(id, p){ return EQRANK[LIB[id].need] <= EQRANK[p.equip]; }
function candidates(pat, p, exclude, avoid){
  return Object.keys(LIB).filter(id => LIB[id].p===pat && available(id,p) && !exclude.includes(id) && !(LIB[id].st||[]).some(j=>avoid.includes(j)));
}
function pick(pat, p, exclude, usage){
  let c = candidates(pat, p, exclude, p.limits);
  if (!c.length && FALLBACK[pat]) c = candidates(FALLBACK[pat], p, exclude, p.limits);
  if (!c.length) c = candidates(pat, p, exclude, []);
  if (!c.length) return null;
  const order = Object.keys(LIB);
  c.sort((a,b) => (usage[a]||0)-(usage[b]||0) || order.indexOf(a)-order.indexOf(b));
  return c[0];
}
function buildPlan(p, old){
  const tpl = SPLITS[p.days];
  const nSlots = {30:4,45:5,60:6,75:7}[p.duration] || 6;
  const cardio = (p.goal==="ricomposizione"||p.goal==="resistenza") && p.duration>=45;
  const usage = {}, ex = {};
  const sessions = tpl.map(s => {
    const items = [];
    let n = nSlots - (cardio?1:0);
    if (p.level==="principiante") n = Math.min(n, 5);
    for (const pat of s.slots){ if (items.length>=n) break; const id = pick(pat,p,items,usage); if (id){ items.push(id); usage[id]=(usage[id]||0)+1; } }
    if (cardio) items.push(p.goal==="resistenza" ? "intervals" : "z2");
    items.forEach(id => { if (!ex[id]) ex[id] = Object.assign(rx(id,p), {load: old?.ex?.[id]?.load ?? null}); });
    return {k:s.k, name:s.name, items};
  });
  return {days:p.days, sessions, ex, rot:0, dupI:0, created:today(), lastDeload:today(), deloadUntil:null, fatigue:0, changes: old?.changes || []};
}

/* ================= Lente attiva ================= */
function recent(days){ const from = addDays(today(), -days); return SESS.filter(s => s.d >= from && !s.recovery); }
function adherence(){ const n = recent(14).length; return clamp(n / (S.profile.days*2), 0, 1); }
function autoLens(){
  const p = S.profile, last5 = SESS.slice(0,5).map(s => s.rd?.mood).filter(Boolean);
  const planAge = daysBetween(S.plan.created, today());
  if ((planAge >= 14 && adherence() < 0.5) || (last5.length>=3 && mean(last5) <= 2.2) || p.motiv.stress>=5 || (p.motiv.stress>=4 && p.motiv.barriers.includes("tempo")))
    return {id:"aderenza", why:"Stress, tempo o motivazione indicano che oggi conta di più non saltare che spingere."};
  if (p.level==="principiante") return {id:"doppia", why:"Da principiante la progressione più semplice è anche la più efficace."};
  if (p.goal==="forza" || p.level==="avanzato") return {id:"dup", why:"Con la tua esperienza, alternare giorni pesanti e leggeri gestisce meglio fatica e articolazioni."};
  return {id:"rir", why:"Il carico si regola su quanto margine ti resta a fine serie."};
}
function lens(){ const pref = S.profile.lensPref; return pref && pref!=="auto" ? {id:pref, why:"Scelta da te nel profilo."} : autoLens(); }

/* ================= Prontezza ================= */
function readinessScore(r){ return Math.round(((r.sleep-1)+(r.energy-1)+(5-r.stress)+(5-r.doms)+(r.mood-1))/20*100); }
function zoneOf(score){ return score>=65 ? "go" : score>=40 ? "warn" : "stop"; }
const ZONE = {go:"Pieno carico", warn:"Carico ridotto", stop:"Recupero attivo"};

/* ================= Seduta di oggi ================= */
function altFor(id, avoid, excludeList){
  const p = S.profile, L = LIB[id];
  let c = candidates(L.p, p, [id, ...(excludeList||[])], avoid);
  if (!c.length && FALLBACK[L.p]) c = candidates(FALLBACK[L.p], p, [id, ...(excludeList||[])], avoid);
  if (!c.length) return null;
  const use = {}; S.plan.sessions.forEach(s => s.items.forEach(x => use[x]=(use[x]||0)+1));
  c.sort((a,b) => (use[a]||0)-(use[b]||0));
  return c[0];
}
function deloadActive(){ return S.plan.deloadUntil && today() <= S.plan.deloadUntil; }
function buildToday(sIdx, rd){
  const plan = S.plan, ses = plan.sessions[sIdx], L = lens();
  const dayType = L.id==="dup" ? DUPCYCLE[plan.dupI % 3] : null;
  let ids = ses.items.slice();
  if (L.id==="aderenza"){ const strength = ids.filter(i=>LIB[i].t!=="cardio").slice(0,4); ids = strength.concat(ids.filter(i=>LIB[i].t==="cardio").slice(0,1)); }
  const items = ids.map(id0 => {
    let id = id0, note = [];
    if (rd && rd.pain && rd.pain!=="none" && (LIB[id].st||[]).includes(rd.pain)){
      const a = altFor(id, [rd.pain], ids); if (a){ note.push(`Sostituisce ${LIB[id].n} per proteggere ${JOINT[rd.pain]}`); id = a; }
    }
    const base = plan.ex[id0] || rx(id, S.profile);
    const r = {sets:base.sets, rl:base.rl, rh:base.rh, rir:base.rir, rest:base.rest, load: id===id0 ? base.load : (plan.ex[id]?.load ?? null)};
    const u = unitOf(id), inc = LIB[id].inc || 1;
    if (dayType && LIB[id].t==="c" && u==="kg"){
      if (dayType==="forza"){ r.rl = Math.max(3, r.rl-3); r.rh = r.rl+2; r.rest = Math.max(r.rest,150); if (r.load) r.load = roundTo(r.load*1.08, inc); }
      if (dayType==="volume"){ r.rl = r.rh; r.rh = r.rh+4; r.rest = Math.min(r.rest,90); if (r.load) r.load = roundTo(r.load*0.85, inc); }
    }
    if (L.id==="aderenza"){ r.sets = Math.min(r.sets,2); r.rir += 1; }
    if (deloadActive()){ r.sets = Math.max(1, Math.ceil(r.sets/2)); if (r.load) r.load = roundTo(r.load*0.9, inc); note.push("Settimana di scarico"); }
    if (rd){
      if (rd.zone==="warn"){ if (LIB[id].t==="i") r.sets = Math.max(1, r.sets-1); r.rir += 1; if (r.load) r.load = roundTo(r.load*0.95, inc); }
      if (rd.zone==="stop"){ r.sets = Math.max(1, Math.ceil(r.sets/2)); r.rir = 4; if (r.load) r.load = roundTo(r.load*0.85, inc); }
    }
    const sets = Array.from({length:r.sets}, () => ({kg: u==="kg" && r.load ? r.load : "", reps:"", rir:"", done:false}));
    return {id, orig:id0, rx:r, sets, note, fb:"giusto", painJ:""};
  });
  return {id:rid(), d:today(), sIdx, k:ses.k, name:ses.name, lens:L.id, dayType, deload:deloadActive(), rd, start:Date.now(), items, stage:"log", rpe:6, enjoy:4, note:""};
}
function nextIdx(){ return S.plan.rot % S.plan.sessions.length; }

/* ================= Motore di adattamento ================= */
function logChange(c){ S.plan.changes.unshift(Object.assign({d:today()}, c)); S.plan.changes = S.plan.changes.slice(0,80); }
function replaceEx(oldId, newId, why, src){
  const plan = S.plan;
  plan.sessions.forEach(s => { s.items = s.items.map(x => x===oldId ? newId : x); });
  if (!plan.ex[newId]) plan.ex[newId] = Object.assign(rx(newId, S.profile), {load:null});
  if (!plan.sessions.some(s => s.items.includes(oldId))) delete plan.ex[oldId];
  logChange({id:newId, name:LIB[newId].n, what:"esercizio", from:LIB[oldId].n, to:LIB[newId].n, why, src});
}
function adaptItem(it, draft, out){
  const id = it.orig, e = S.plan.ex[id]; if (!e) return;
  const L = LIB[id], u = unitOf(id), inc = L.inc || 1;
  const push = (what, from, to, why) => { out.push({id, name:L.n, what, from, to, why, src:"regole"}); };
  if (it.id !== id) return; // oggi era una sostituzione temporanea: il piano resta com'era
  if (it.fb==="dolore"){
    const avoid = it.painJ && it.painJ!=="other" ? [it.painJ] : (L.st||[]);
    const a = altFor(id, avoid);
    if (a){ out.push({swap:[id,a], why:`Hai segnalato dolore${it.painJ?" a "+JOINT[it.painJ]:""}: passo a una variante che lo sollecita meno.`}); return; }
    if (e.sets>1){ push("serie", e.sets, e.sets-1, "Dolore segnalato e nessuna variante più comoda disponibile: riduco il volume."); e.sets--; }
    if (e.load){ const nl = roundTo(e.load*0.85, inc); push("carico", e.load, nl, "Carico ridotto del 15% finché il dolore non passa."); e.load = nl; }
    return;
  }
  if (it.fb==="noioso"){
    const a = altFor(id, S.profile.limits);
    if (a){ out.push({swap:[id,a], why:"Ti annoiava: stessa funzione muscolare, esercizio diverso. Il piacere conta per la costanza."}); return; }
  }
  const done = it.sets.filter(s => s.done && Number(s.reps) > 0);
  if (!done.length) return;
  const reps = done.map(s => Number(s.reps));
  const rirs = done.map(s => s.rir==="" ? it.rx.rir : Number(s.rir));
  const avgRir = mean(rirs);
  const allTop = done.length >= it.rx.sets && reps.every(r => r >= it.rx.rh);
  const below = reps.filter(r => r < it.rx.rl).length;
  let raised = false;
  const prog = !draft.dayType || draft.dayType==="ipertrofia";
  if (u==="kg"){
    const top = Math.max(...done.map(s => Number(s.kg)||0));
    if (top>0 && !e.load){ push("carico", "–", top, "Primo carico registrato: diventa il riferimento."); e.load = top; }
    if (prog && top>0 && !deloadActive() && (!draft.rd || draft.rd.zone!=="stop")){
      const base = Math.max(top, e.load||0);
      if (draft.lens==="doppia"){
        if (allTop){ const nl = roundTo(base+inc, inc); push("carico", e.load, nl, `Tutte le serie al tetto di ${it.rx.rh} ripetizioni: sali di carico e riparti da ${it.rx.rl}.`); e.load = nl; raised = true; }
        else if (below >= 2){ push("obiettivo", "", `${it.rx.rl}–${it.rx.rh} rip`, "Sotto il range in più serie: tieni il carico e punta a una ripetizione in più per serie."); }
      } else {
        if (allTop && avgRir >= it.rx.rir){ const step = avgRir >= it.rx.rir+2 ? 2 : 1; const nl = roundTo(base+inc*step, inc);
          push("carico", e.load, nl, `Range completato con ${fmtNum(avgRir)} ripetizioni di margine (obiettivo ${it.rx.rir}): +${fmtNum(inc*step)} kg.`); e.load = nl; raised = true; }
        else if (avgRir < it.rx.rir-1 || below >= 2){ const nl = roundTo(base*0.95, inc); if (nl < (e.load||base)){ push("carico", e.load, nl, "Troppo vicino al cedimento o sotto il range: carico −5% per tornare nella zona utile."); e.load = nl; } }
      }
    }
  } else if (prog && allTop){
    const cap = u==="s" ? 90 : u==="min" ? 45 : 25;
    if (it.rx.rh < cap){ const nl = it.rx.rl+2, nh = Math.min(cap, it.rx.rh+2); push("ripetizioni", `${e.rl}–${e.rh}`, `${nl}–${nh}`, "Range completato: alzo l'obiettivo."); e.rl = nl; e.rh = nh; raised = true; }
    else { const a = altFor(id, S.profile.limits); if (a) out.push({swap:[id,a], why:"Hai raggiunto il tetto del range: passa a una variante più impegnativa."}); }
  }
  if (it.fb==="facile" && !raised){
    const deficit = S.profile.nutrition.has!=="no" && S.profile.nutrition.phase==="deficit";
    if (u==="kg" && e.load){ const nl = roundTo(e.load+inc, inc); push("carico", e.load, nl, "Lo hai trovato facile."); e.load = nl; }
    else if (e.sets < 5 && !deficit){ push("serie", e.sets, e.sets+1, "Lo hai trovato facile: una serie in più (volume e crescita vanno di pari passo)."); e.sets++; }
    else { push("ripetizioni", `${e.rl}–${e.rh}`, `${e.rl+2}–${e.rh+2}`, "Lo hai trovato facile."); e.rl+=2; e.rh+=2; }
  }
  if (it.fb==="duro"){
    if (e.sets > 2){ push("serie", e.sets, e.sets-1, "Lo hai trovato troppo duro: tolgo una serie, il carico resta."); e.sets--; }
    else if (u==="kg" && e.load){ const nl = roundTo(e.load*0.93, inc); push("carico", e.load, nl, "Troppo duro con già poche serie: carico −7%."); e.load = nl; }
  }
}
function finishSession(draft){
  const out = [];
  draft.items.forEach(it => adaptItem(it, draft, out));
  out.forEach(c => { if (c.swap) replaceEx(c.swap[0], c.swap[1], c.why, "regole"); else logChange(c); });
  const plan = S.plan;
  if (!draft.recovery){ plan.rot++; if (draft.lens==="dup") plan.dupI++; }
  plan.fatigue = draft.rpe >= 9 ? plan.fatigue+1 : Math.max(0, plan.fatigue-1);
  const rec = {id:draft.id, d:draft.d, k:draft.k, name:draft.name, lens:draft.lens, dayType:draft.dayType, recovery:!!draft.recovery,
    rd:draft.rd, rpe:draft.rpe, enjoy:draft.enjoy, note:draft.note, dur:Math.round((Date.now()-draft.start)/60000),
    items:draft.items.map(it => ({id:it.id, orig:it.orig, fb:it.fb, painJ:it.painJ, rx:it.rx, sets:it.sets.filter(s=>s.done).map(s=>({kg:Number(s.kg)||0, reps:Number(s.reps)||0, rir:s.rir===""?null:Number(s.rir)}))}))};
  const prs = findPRs(rec);
  SESS.unshift(rec);
  return {rec, changes:out, prs};
}
const e1rm = (kg, reps, rir) => kg>0 && reps>0 ? kg*(1+((reps+(rir||0)))/30) : 0;
function bestE1(id, sessions){ let b = 0; sessions.forEach(s => s.items.forEach(it => { if (it.id===id) it.sets.forEach(x => { b = Math.max(b, e1rm(x.kg,x.reps,x.rir)); }); })); return b; }
function findPRs(rec){
  const prs = [];
  rec.items.forEach(it => { if (LIB[it.id].t!=="c" || unitOf(it.id)!=="kg") return;
    const now = Math.max(0, ...it.sets.map(x => e1rm(x.kg,x.reps,x.rir))); const prev = bestE1(it.id, SESS);
    if (now>0 && prev>0 && now > prev*1.005) prs.push({name:LIB[it.id].n, now, prev}); });
  return prs;
}

/* ================= Coach ================= */
const TIPS = [
  ["Il sonno è un carico", "Sotto le 7 ore il recupero rallenta: se stanotte hai dormito poco, il check di oggi lo terrà in conto."],
  ["Le proteine contano", "Distribuire le proteine su 3–4 pasti aiuta il recupero; il riferimento delle meta-analisi è circa 1,6 g per kg al giorno."],
  ["Il margine è voluto", "Fermarti con 1–3 ripetizioni nel serbatoio dà quasi gli stessi risultati del cedimento con meno fatica."],
  ["La costanza batte l'intensità", "Due sedute brevi fatte valgono più di una perfetta saltata."],
  ["Scegli tu", "Puoi sostituire qualunque esercizio: la scheda si adatta a te, non il contrario."],
  ["Muoviti anche nei giorni liberi", "Una camminata di 20–30 minuti accelera il recupero e conta per la salute del cuore."]
];
function coachLine(){
  const p = S.profile, name = p.name ? p.name.split(" ")[0] : "";
  if (!SESS.length){
    const why = p.motiv.why[0];
    const map = {salute:"stai facendo una cosa per la tua salute", aspetto:"stai lavorando su come ti vedi e ti senti", forza:"stai iniziando a costruire forza vera", energia:"stai investendo nella tua energia di tutti i giorni", sport:"stai preparando il corpo per il tuo sport"};
    return {t:`Si parte${name?", "+esc(name):""}`, b:`Prima seduta: ${map[why]||"stai iniziando"}. Oggi l'obiettivo è imparare i movimenti e trovare i carichi giusti, non spingere al massimo.`};
  }
  const last = SESS[0], gap = daysBetween(last.d, today());
  if (gap >= 5){
    const b = p.motiv.barriers;
    const extra = b.includes("tempo") ? " Se hai poco tempo, la versione da 25 minuti qui sotto vale comunque." : b.includes("motivazione") ? " Non serve la voglia per iniziare: serve solo il primo esercizio." : "";
    return {t:"Ripartire conta più del recupero", b:`Sono passati ${gap} giorni. Nessuna seduta da recuperare: si riprende da dove sei.${extra}`};
  }
  const wk = weeksStreak();
  if (wk >= 2) return {t:`${wk} settimane di fila`, b:`Hai rispettato il tuo obiettivo di ${p.days} sedute per ${wk} settimane consecutive. È questo che costruisce i risultati.`};
  if (p.motiv.drive==="progressi"){
    const lift = topLift(); if (lift && lift.gain>0) return {t:"Il numero della settimana", b:`${esc(lift.name)}: massimale stimato +${fmtNum(lift.gain)} kg dall'inizio (${fmtNum(lift.first)} → ${fmtNum(lift.now)} kg).`};
  }
  const tip = TIPS[hash(today()) % TIPS.length];
  return {t:tip[0], b:tip[1]};
}
function weeksStreak(){
  let n = 0; const p = S.profile; const monday = d => addDays(d, -(wd(d)-1));
  let start = monday(today());
  const thisWeek = SESS.filter(s => !s.recovery && s.d >= start).length;
  if (thisWeek >= p.days) n++;
  for (let i=1;i<52;i++){ const a = addDays(start, -7*i), b = addDays(a, 6);
    const c = SESS.filter(s => !s.recovery && s.d >= a && s.d <= b).length; if (c >= p.days) n++; else break; }
  return n;
}
function topLift(){
  const ids = Object.keys(S.plan.ex).filter(id => LIB[id].t==="c" && unitOf(id)==="kg");
  let best = null;
  ids.forEach(id => { const pts = e1Series(id); if (pts.length>=2){ const g = pts[pts.length-1].y - pts[0].y; if (!best || g > best.gain) best = {name:LIB[id].n, gain:g, first:pts[0].y, now:pts[pts.length-1].y}; } });
  return best;
}
function e1Series(id){
  return SESS.slice().reverse().map(s => { const it = s.items.find(i => i.id===id); if (!it || !it.sets.length) return null;
    return {x:s.d, y:Math.round(Math.max(...it.sets.map(x => e1rm(x.kg,x.reps,x.rir)))*10)/10}; }).filter(p => p && p.y>0);
}

/* ================= Nutrizione (stime) ================= */
function energy(p){
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age + (p.sex==="F" ? -161 : 5);
  const f = p.days<=2 ? 1.375 : p.days<=4 ? 1.55 : 1.725;
  return {bmr:Math.round(bmr), tdee:Math.round(bmr*f/10)*10, prot:Math.round(p.weight*1.6), bmi:p.weight/((p.height/100)**2)};
}

const LS_KEY = "scheda-viva-v1";
const Store = {
  mode:"local", db:null, uid:null, saving:false, again:false, t:null,
  async init(){
    const C = window.claude;
    if (C && C.use){
      const [db, user, sample, downloads] = await Promise.all(["db","user","sample","downloads"].map(n => C.use(n).catch(() => null)));
      ui.sample = sample; ui.downloads = downloads;
      const uid = user ? await user.id().catch(() => null) : null;
      if (db && uid){
        this.db = db; this.uid = uid; this.mode = "cloud";
        try {
          const withTimeout = pr => Promise.race([pr, new Promise((_,rej) => setTimeout(() => rej({code:"timeout"}), 10000))]);
          const [st, q] = await withTimeout(Promise.all([this.ref().get(), this.sessRef().orderBy("d","desc").limit(400).get()]));
          if (st.exists){ S = JSON.parse(JSON.stringify(st.data().state)); }
          SESS = q.docs.map(d => JSON.parse(JSON.stringify(d.data()))).sort((a,b) => b.d.localeCompare(a.d) || (b.id>a.id?1:-1));
          return;
        } catch(e){ this.mode = "local"; toast("Archivio online non raggiungibile: uso la memoria di questo dispositivo."); }
      }
    }
    try { const raw = localStorage.getItem(LS_KEY); if (raw){ const o = JSON.parse(raw); S = o.S; SESS = o.SESS || []; } } catch(e){}
  },
  ref(){ return this.db.doc("data/users/"+this.uid+"/app"); },
  sessRef(){ return this.ref().collection("sessions"); },
  save(){ if (ui.demo) return; clearTimeout(this.t); this.t = setTimeout(() => this.flush(), 700); },
  async flush(){
    if (ui.demo || !S) return;
    if (this.mode!=="cloud"){ try { localStorage.setItem(LS_KEY, JSON.stringify({S, SESS:SESS.slice(0,400)})); } catch(e){} return; }
    if (this.saving){ this.again = true; return; }
    this.saving = true;
    try { await this.ref().set({state:JSON.parse(JSON.stringify(S)), updated:new Date().toISOString()}); }
    catch(e){ if (e && e.code==="quota_exceeded") toast("Spazio pieno: esporta e cancella le sedute più vecchie."); else toast("Salvataggio non riuscito, riprovo alla prossima modifica."); }
    this.saving = false;
    if (this.again){ this.again = false; this.flush(); }
  },
  async saveSession(rec){
    if (ui.demo) return;
    if (this.mode!=="cloud"){ this.flush(); return; }
    try { await this.sessRef().doc(rec.id).set(JSON.parse(JSON.stringify(rec))); } catch(e){ toast("Seduta non salvata online: riprova più tardi."); }
  },
  async wipe(){
    if (this.mode==="cloud"){
      for (const s of SESS){ try { await this.sessRef().doc(s.id).delete(); } catch(e){} }
      try { await this.ref().delete(); } catch(e){}
    }
    try { localStorage.removeItem(LS_KEY); } catch(e){}
  }
};

function loadDemo(){
  ui.demo = true;
  const p = Object.assign(blankProfile(), {name:"Giulia (esempio)", sex:"F", age:32, height:165, weight:62, level:"intermedio", goal:"ipertrofia", days:3, weekdays:[1,3,5], duration:60, equip:"gym",
    motiv:{why:["forza","energia"], barriers:["tempo"], drive:"progressi", stress:3, sleep:7, time:"sera"}});
  S = {v:1, profile:p, plan:null, body:[], draft:null, intent:null};
  SESS = [];
  S.plan = buildPlan(p); S.plan.created = addDays(today(), -26); S.plan.lastDeload = S.plan.created;
  const start = { squat:45, hinge:50, hpush:30, vpush:10, hpull:30, vpull:35, single:8, core:5, carry:14, bi:6, tri:15, shoulder:4, calf:20 };
  Object.keys(S.plan.ex).forEach(id => { if (unitOf(id)==="kg") S.plan.ex[id].load = start[LIB[id].p] || 10; });
  let d = addDays(today(), -26), n = 0;
  while (d < today()){
    if ([1,3,5].includes(wd(d)) && !(n===4)){
      const rd = {sleep:3+(n%3===0?1:0), energy:3+(n%2), stress:2+(n%3===1?1:0), doms:2+(n%4===0?1:0), mood:4-(n===5?1:0), pain:"none"};
      rd.score = readinessScore(rd); rd.zone = zoneOf(rd.score);
      const dr = buildToday(nextIdx(), rd); dr.d = d; dr.start = Date.now()-55*60000;
      dr.items.forEach((it,i) => { it.sets.forEach(s => { s.done = true; s.reps = it.rx.rh - ((n+i)%3===0 ? 1 : 0); s.rir = it.rx.rir + ((n+i)%4===0 ? 1 : 0); if (unitOf(it.id)==="kg") s.kg = it.rx.load || s.kg || 10; }); if ((n+i)%9===0) it.fb = "facile"; });
      dr.rpe = 6 + (n%3); dr.enjoy = 4;
      const res = finishSession(dr); res.rec.d = d; S.plan.changes.forEach(c => { if (c.d === today()) c.d = d; }); // le modifiche portano la data della seduta
    }
    if (wd(d)===1) S.body.push({d, kg:62 + 0.08*n});
    d = addDays(d, 1); n++;
  }
  SESS.sort((a,b) => b.d.localeCompare(a.d));
  S.body.sort((a,b) => a.d.localeCompare(b.d));
  ui.route = "oggi"; history.replaceState(null, "", "#oggi");
  render();
}

function plateMath(kg){
  const side = (kg-20)/2; if (side<0) return "";
  const P = [[25,"--p25",34],[20,"--p20",31],[15,"--p15",28],[10,"--p10",24],[5,"--p5",18],[2.5,"--p25",14],[1.25,"--p2",11]];
  let r = side; const used = [];
  for (const [w,c,h] of P){ while (r >= w-1e-9){ used.push([w,c,h]); r -= w; } }
  if (!used.length) return `<span class="small muted">solo bilanciere (20 kg)</span>`;
  return `<span class="plates" title="Dischi per lato">${used.map(([w,c,h]) => `<i class="plate" style="height:${h}px;background:var(${c})"></i>`).join("")}</span> <span class="small muted mono">${used.map(u=>fmtNum(u[0],2)).join(" + ")} per lato</span>`;
}
function rxText(r, id){
  const u = unitOf(id), lab = LIB[id].rlab || (u==="s" ? "s" : u==="min" ? "min" : "rip");
  if (LIB[id].t==="cardio") return `<span class="rx"><span class="rxb"><span class="rxb-main">${r.rl}–${r.rh} min</span></span></span>`;
  const load = u==="kg" ? (r.load ? `<span class="rxb-load">${fmtNum(r.load,2)} kg</span>` : `<span class="rxb-load none">carico da trovare</span>`) : u==="bw" ? `<span class="rxb-load none">corpo libero</span>` : "";
  const rest = r.rest ? `, recupero ${r.rest>=120?fmtNum(r.rest/60)+" min":r.rest+" s"}` : "";
  return `<span class="rx"><span class="rxb"><span class="rxb-main">${r.sets} × ${r.rl}–${r.rh}</span>${load}</div><span class="rxb-meta">${lab==="rip"?"ripetizioni":lab==="s"?"secondi":lab}, ${r.rir} in riserva${rest}</span></span>`;
}
function barbell(score, zone, opts={}){
  const n = opts.colors ? opts.colors.length : score>=80 ? 4 : score>=65 ? 3 : score>=40 ? 2 : 1;
  const H = [74,66,58,50], cols = opts.colors || Array(n).fill(`var(--${zone})`);
  let pl = "";
  for (let i=0;i<n;i++){ const h = H[i], y = 50-h/2, xl = 92-(i+1)*15, xr = 228+i*15;
    pl += `<rect class="pl" style="animation-delay:${i*70}ms" x="${xl}" y="${y}" width="12" height="${h}" rx="3" fill="${cols[i]}"/><rect class="pl" style="animation-delay:${i*70}ms" x="${xr}" y="${y}" width="12" height="${h}" rx="3" fill="${cols[i]}"/>`; }
  const mid = opts.colors ? "" : `<text x="160" y="58" text-anchor="middle" font-family="Archivo,sans-serif" font-weight="850" font-stretch="125%" font-size="28" fill="var(--ink)">${score}</text>`;

    <rect x="6" y="46" width="308" height="8" rx="4" fill="var(--steel)"/>

    ${mid ? `<rect x="118" y="30" width="84" height="40" rx="10" fill="var(--bg)"/>` : ""}${pl}${mid}</svg>`;
}

/* ---------- Progressi ---------- */
function lineChart(pts, unit, h=150){
  if (pts.length < 2) return `<div class="empty muted small">Servono almeno due rilevazioni per il grafico.</div>`;
  const W = 340, H = h, l = 34, r = 10, t = 12, b = 22;
  const ys = pts.map(p => p.y); let lo = Math.min(...ys), hi = Math.max(...ys); if (hi-lo < 1){ hi += 1; lo -= 1; }
  const padY = (hi-lo)*0.15; lo -= padY; hi += padY;
  const x0 = dOf(pts[0].x).getTime(), x1 = dOf(pts[pts.length-1].x).getTime() || x0+1;
  const X = d => l + (W-l-r) * ((dOf(d).getTime()-x0) / Math.max(1, x1-x0));
  const Y = y => t + (H-t-b) * (1 - (y-lo)/(hi-lo));
  const ticks = [lo+(hi-lo)*0.15, (lo+hi)/2, hi-(hi-lo)*0.15];
  const path = pts.map((p,i) => `${i?"L":"M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const last = pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento ${unit}">
    ${ticks.map(v => `<line class="grid" x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${l-6}" y="${Y(v)+3}" text-anchor="end">${fmtNum(v)}</text>`).join("")}
    <path class="area" d="${path}L${X(last.x)},${H-b}L${X(pts[0].x)},${H-b}Z"/><path class="ln" d="${path}"/>
    <circle class="dot" cx="${X(last.x)}" cy="${Y(last.y)}" r="4"/>
    <text x="${l}" y="${H-6}">${fmtDate(pts[0].x)}</text><text x="${W-r}" y="${H-6}" text-anchor="end">${fmtDate(last.x)}</text></svg>`;
}

/* ---------- Timer di recupero ---------- */
let timerInt = null;
function renderTimer(){
  const el = $("#timer"), t = ui.timer;
  if (!t){ el.innerHTML = ""; return; }
  const left = Math.max(0, Math.round((t.end - Date.now())/1000));
  el.innerHTML = `<div class="timer"><div class="in"><span>Recupero <b id="tleft">${Math.floor(left/60)}:${pad(left%60)}</b></span><button class="btn-sm" data-act="t-add">+30″</button><button class="btn-sm" data-act="t-stop">Stop</button></div></div>`;
}
function startTimer(s){
  ui.timer = {end: Date.now()+s*1000}; renderTimer(); clearInterval(timerInt);
  timerInt = setInterval(() => { const t = ui.timer; if (!t){ clearInterval(timerInt); return; }
    const left = Math.round((t.end-Date.now())/1000); const el = $("#tleft");
    if (left <= 0){ ui.timer = null; clearInterval(timerInt); renderTimer(); toast("Recupero finito: prossima serie."); try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){} return; }
    if (el) el.textContent = `${Math.floor(left/60)}:${pad(left%60)}`; }, 500);
}

  S.plan.sessions.forEach(s => s.items.forEach(id => { const c = candidates(LIB[id].p, p, [id], p.limits); alts[id] = c.slice(0,4); }));
  const ctx = {
    profilo:{eta:p.age, sesso:p.sex, altezza_cm:p.height, peso_kg:S.body.length?S.body[S.body.length-1].kg:p.weight, livello:p.level, obiettivo:p.goal, giorni:p.days, durata_min:p.duration, attrezzatura:p.equip, articolazioni_da_rispettare:p.limits, nutrizione:p.nutrition, motivazione:p.motiv, sicurezza_risposte_si:p.parq.filter(Boolean).length},
    lente_attiva:{id:L.id, nome:LENSES[L.id].n}, scarico_attivo:deloadActive(),
    scheda:S.plan.sessions.map(s => ({seduta:s.name, esercizi:s.items.map(id => { const e = S.plan.ex[id]; return {id, nome:LIB[id].n, serie:e.sets, ripetizioni:`${e.rl}-${e.rh}`, rir:e.rir, carico_kg:e.load, alternative_possibili:alts[id]}; })})),
    ultime_sedute:SESS.slice(0,8).map(s => ({data:s.d, seduta:s.name, prontezza:s.rd?{punteggio:s.rd.score, sonno:s.rd.sleep, energia:s.rd.energy, stress:s.rd.stress, indolenzimento:s.rd.doms, voglia:s.rd.mood, dolore:s.rd.pain}:null, rpe_seduta:s.rpe, piacere:s.enjoy, nota:s.note||undefined,
      esercizi:s.items.map(it => ({id:it.id, serie:it.sets.map(x => `${x.kg?x.kg+"kg x ":""}${x.reps}${x.rir!=null?" @RIR"+x.rir:""}`).join(", "), feedback:it.fb, dolore:it.painJ||undefined}))})),
    modifiche_gia_applicate_dalle_regole:S.plan.changes.slice(0,10).map(c => `${c.d} ${c.name}: ${c.what} ${c.from}→${c.to}`)
  };
  return `Sei un preparatore atletico e chinesiologo che segue un cliente tramite un'app di allenamento. Le regole automatiche hanno già aggiornato la scheda dopo l'ultima seduta. Il tuo compito: una seconda opinione, attenta al piano psicofisico (prontezza, stress, piacere, note, dolori), non solo ai numeri.

Principi da rispettare: progressione graduale del carico; volume per muscolo coerente con il livello (le meta-analisi indicano una relazione dose-risposta, circa 10-20 serie settimanali per gli allenati); RIR 1-3 per l'ipertrofia, 2-3 per la forza; se c'è dolore ricorrente preferisci varianti meno stressanti e suggerisci un professionista; se motivazione o piacere sono bassi favorisci esercizi graditi e dosi minime efficaci; linguaggio che sostiene l'autonomia, mai colpevolizzante. Non fare diagnosi.

Proponi al massimo 4 modifiche, solo se davvero utili. Se la scheda va bene, lascia l'elenco vuoto.
Per "sostituisci" usa come valore uno degli id in "alternative_possibili" di quell'esercizio. Per "carico" un numero in kg. Per "serie" un intero 1-6. Per "ripetizioni" una stringa "min-max". Per "rir" un intero 0-4.

Rispondi solo con un oggetto JSON in italiano con questa forma:
{"sintesi":"una frase su come sta andando","messaggio":"2-3 frasi motivazionali personali","modifiche":[{"exerciseId":"id","tipo":"carico|serie|ripetizioni|rir|sostituisci","valore":0,"motivo":"perché, in una frase"}]}

Dati del cliente:
${JSON.stringify(ctx)}`;
}
function validateProposal(m){
  const e = S.plan.ex[m.exerciseId]; if (!e || !LIB[m.exerciseId]) return false;
  if (m.tipo==="carico"){ const v = Number(m.valore); if (!(v>0)) return false; if (e.load && Math.abs(v-e.load)/e.load > 0.2) return false; return unitOf(m.exerciseId)==="kg"; }
  if (m.tipo==="serie"){ const v = Number(m.valore); return Number.isInteger(v) && v>=1 && v<=6; }
  if (m.tipo==="rir"){ const v = Number(m.valore); return Number.isInteger(v) && v>=0 && v<=4; }
  if (m.tipo==="ripetizioni"){ const r = String(m.valore).split(/[-–]/).map(Number); return r.length===2 && r[0]>=1 && r[1]>=r[0] && r[1]<=60; }
  if (m.tipo==="sostituisci"){ const n = LIB[m.valore]; if (!n || m.valore===m.exerciseId || !available(m.valore, S.profile)) return false; const pat = LIB[m.exerciseId].p; return n.p===pat || FALLBACK[pat]===n.p; }
  return false;
}
async function askClaude(){
  if (!ui.sample) return;
  claudeCtl = new AbortController();
  ui.claude = {state:"loading"}; render();
  try {
    const res = await ui.sample.json(claudePrompt(), {signal:claudeCtl.signal, cache:false});
    if (!res || typeof res!=="object") throw {code:"invalid_json"};
    res.modifiche = (Array.isArray(res.modifiche) ? res.modifiche : []).slice(0,4).map(m => Object.assign({}, m, {_ok: validateProposal(m)}));
    ui.claude = {state:"done", res};
  } catch(e){
    const code = e?.code;
    if (code==="cancelled") ui.claude = null;
    else if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){ ui.claude = {state:"error", msg:"Claude non è disponibile in questa vista. Le regole automatiche continuano a funzionare."}; }
    else if (code==="rate_limited") ui.claude = {state:"error", msg:"Troppe richieste in poco tempo: riprova tra qualche minuto.", retry:true};
    else ui.claude = {state:"error", msg:"Non sono riuscito a leggere la risposta di Claude.", retry:true};
  }
  render();
}
function applyClaude(){
  const res = ui.claude?.res; if (!res) return;
  document.querySelectorAll("[data-cp]").forEach(cb => {
    if (!cb.checked) return; const m = res.modifiche[Number(cb.dataset.cp)]; if (!m || !m._ok) return;
    const e = S.plan.ex[m.exerciseId]; if (!e) return; const name = LIB[m.exerciseId].n;
    if (m.tipo==="sostituisci"){ replaceEx(m.exerciseId, m.valore, m.motivo, "Claude"); return; }
    if (m.tipo==="carico"){ logChange({id:m.exerciseId, name, what:"carico", from:e.load, to:Number(m.valore), why:m.motivo, src:"Claude"}); e.load = Number(m.valore); }
    if (m.tipo==="serie"){ logChange({id:m.exerciseId, name, what:"serie", from:e.sets, to:Number(m.valore), why:m.motivo, src:"Claude"}); e.sets = Number(m.valore); }
    if (m.tipo==="rir"){ logChange({id:m.exerciseId, name, what:"rir", from:e.rir, to:Number(m.valore), why:m.motivo, src:"Claude"}); e.rir = Number(m.valore); }
    if (m.tipo==="ripetizioni"){ const [a,b] = String(m.valore).split(/[-–]/).map(Number); logChange({id:m.exerciseId, name, what:"ripetizioni", from:`${e.rl}–${e.rh}`, to:`${a}–${b}`, why:m.motivo, src:"Claude"}); e.rl = a; e.rh = b; }
  });
  ui.claude.applied = true; Store.save(); render();
}

/* ---------- Toast ---------- */
let toastT = null;
function toast(msg){ let el = $(".toast"); if (!el){ el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); } el.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2800); }

/* ================= Azioni ================= */
function readRd(){
  const f = ui.rdForm; const r = {sleep:f.sleep, energy:f.energy, stress:f.stress, doms:f.doms, mood:f.mood, pain:f.pain};
  r.score = readinessScore(r); r.zone = zoneOf(r.score); return r;
}
document.addEventListener("change", ev => {
  const el = ev.target;
  if (!S || !S.plan || ui.editing) return;
  if (ui.route==="oggi" && !S.draft && ui.rdForm && ["sleep","energy","stress","doms","mood","pain"].includes(el.name)){ ui.rdForm[el.name] = el.name==="pain" ? el.value : Number(el.value); return; }
  if (S.draft && S.draft.stage==="fb"){
    if (el.name==="enjoy"){ S.draft.enjoy = Number(el.value); Store.save(); }
    if (el.name.startsWith("fb")){ S.draft.items[Number(el.name.slice(2))].fb = el.value; Store.save(); render(); }
    if (el.name.startsWith("pj")){ S.draft.items[Number(el.name.slice(2))].painJ = el.value; Store.save(); }
  }
  if (el.name==="lens"){ S.profile.lensPref = el.value; Store.save(); render(); toast("Modo di pensare aggiornato."); }
  if (el.id==="lift-sel"){ ui.lift = el.value; render(); }
});
let libT = null;
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id==="lib-q"){ ui.libQ = el.value; clearTimeout(libT); libT = setTimeout(() => { const pos = el.selectionStart; render(); const n = $("#lib-q"); if (n){ n.focus(); try { n.setSelectionRange(pos,pos); } catch(e){} } }, 250); return; }
  if (el.dataset.set && S?.draft){ const [i,j,k] = el.dataset.set.split("."); S.draft.items[i].sets[j][k] = el.value.replace(",", "."); Store.save(); }
  if (el.id==="rpe" && S?.draft){ S.draft.rpe = Number(el.value); $("#rpe-v").textContent = el.value; Store.save(); }
  if (el.id==="fb-note" && S?.draft){ S.draft.note = el.value.slice(0,600); Store.save(); }
});
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a==="ex-info"){ openSheet(b.dataset.id); return; }
  if (a==="plan-tab"){ vt(() => { ui.planTab = b.dataset.t; render(); }, b.dataset.t==="lib" ? "next" : "prev"); return; }
  if (a==="lib-g"){ ui.libGroup = b.dataset.g; render(); return; }
  if (a==="an-view"){ AN.view = Number(b.dataset.v); V3.forEach(v => { v.dragged = false; }); return; }
  if (a==="an-slow"){ AN.speed = AN.speed<1 ? 1 : 0.45; b.textContent = AN.speed<1 ? "Velocità normale" : "Rallenta"; b.setAttribute("aria-pressed", AN.speed<1); return; }
  if (a==="an-pause"){ AN.paused = !AN.paused; b.textContent = AN.paused ? "Riprendi" : "Pausa"; b.setAttribute("aria-pressed", AN.paused); return; }
  if (a==="install" && installEvt){ installEvt.prompt(); try { await installEvt.userChoice; } catch(e){} installEvt = null; render(); return; }
  if (a==="sheet-close"){ closeSheet(); return; }
  if (S?.draft && (a==="next" || a==="prev" || a==="goto")){
    const n = S.draft.items.length, c = S.draft.cur||0;
    const to = a==="next" ? Math.min(n-1,c+1) : a==="prev" ? Math.max(0,c-1) : Number(b.dataset.i);
    if (to===c) return;
    vt(() => { S.draft.cur = to; Store.save(); render(); window.scrollTo(0,0); }, to>c ? "next" : "prev"); return;
  }
  if (a==="ob-next"){ const err = validateStep(); if (err){ toast(err); return; } vt(() => { ui.step++; render(); window.scrollTo(0,0); }, "next"); return; }
  if (a==="ob-back"){ vt(() => { ui.step = Math.max(0, ui.step-1); render(); window.scrollTo(0,0); }, "prev"); return; }
  if (a==="ob-cancel"){ ui.ob = null; ui.step = 0; ui.route = "profilo"; ui.editing = false; render(); return; }
  if (a==="demo"){ vt(() => loadDemo(), "fade"); return; }
  if (a==="exit-demo"){ ui.demo = false; S = null; SESS = []; ui.ob = blankProfile(); ui.step = 1; await Store.init(); if (S && S.plan){ render(); return; } S = null; render(); return; }
  if (a==="ob-finish"){
    const p = ui.ob; const old = S?.plan;
    if (!S) S = {v:1, profile:p, plan:null, body:[{d:today(), kg:Number(p.weight)}], draft:null, intent:null};
    else { S.profile = p; }
    S.plan = buildPlan(p, old);
    if (old) logChange({id:"", name:"Scheda", what:"obiettivo", from:"", to:"ricostruita", why:"Hai aggiornato il profilo: struttura ricalcolata, carichi già registrati mantenuti.", src:"tu"});
    ui.ob = null; ui.step = 0; ui.editing = false; ui.route = "oggi"; Store.save(); vt(() => { history.replaceState(null, "", "#oggi"); render(); window.scrollTo(0,0); }, "fade"); return;
  }
  if (!S || !S.plan) return;
  if (a==="start" || a==="start-short"){
    const rd = readRd(); const d = buildToday(nextIdx(), rd);
    if (a==="start-short"){ d.short = true; d.items = d.items.filter(it => LIB[it.id].t==="c").slice(0,3); d.items.forEach(it => { it.rx.sets = Math.min(it.rx.sets,2); it.sets = it.sets.slice(0,it.rx.sets); }); }
    d.cur = 0; S.draft = d; ui.rdForm = null; Store.save(); vt(() => { render(); window.scrollTo(0,0); }, "next"); return;
  }
  if (a==="recovery"){
    const rd = readRd(); S.draft = {id:rid(), d:today(), sIdx:-1, k:"REC", name:"Recupero attivo", lens:lens().id, dayType:null, rd, start:Date.now(), recovery:true, stage:"log", rpe:3, enjoy:4, note:"",
      items:["z2","dead_bug","glute_bridge"].map(id => ({id, orig:id, rx: id==="z2" ? {sets:1,rl:20,rh:30,rir:4,rest:0} : {sets:2,rl:8,rh:12,rir:4,rest:45}, sets:Array.from({length:id==="z2"?1:2}, () => ({kg:"",reps:"",rir:"",done:false})), note:[], fb:"giusto", painJ:""}))};
    ui.rdForm = null; Store.save(); render(); return;
  }
  if (a==="tick"){ const s = S.draft.items[b.dataset.i].sets[b.dataset.j]; s.done = !s.done; b.setAttribute("aria-pressed", s.done);
    if (s.done && !s.reps){ const it = S.draft.items[b.dataset.i]; s.reps = String(it.rx.rl); const inp = $(`#rp-${b.dataset.i}-${b.dataset.j}`); if (inp) inp.value = s.reps; }
    const allDone = S.draft.items[b.dataset.i].sets.every(x => x.done);
    if (s.done && !allDone){ const r = S.draft.items[b.dataset.i].rx.rest; if (r) startTimer(r); }
    const seg = document.querySelector(`.prog [data-i="${b.dataset.i}"]`); if (seg && allDone) seg.classList.add("ok");
    if (allDone && s.done) toast("Esercizio completato. Passa al prossimo quando sei pronto.");
    Store.save(); return; }
  if (a==="add-set"){ const it = S.draft.items[b.dataset.i]; const last = it.sets[it.sets.length-1] || {kg:""}; it.sets.push({kg:last.kg, reps:"", rir:"", done:false}); Store.save(); render(); return; }
  if (a==="swap-today"){ const it = S.draft.items[b.dataset.i]; const others = S.draft.items.map(x => x.id);
    const c = candidates(LIB[it.id].p, S.profile, others, S.profile.limits); if (!c.length){ toast("Nessuna alternativa disponibile con la tua attrezzatura."); return; }
    const nid = c[0]; it.id = nid; it.note = [`Solo per oggi al posto di ${LIB[it.orig].n}`]; const u = unitOf(nid); const ld = S.plan.ex[nid]?.load || null; it.rx.load = ld; it.sets.forEach(s => { s.kg = u==="kg" && ld ? ld : ""; });
    Store.save(); render(); return; }
  if (a==="rest"){ startTimer(Number(b.dataset.s)); return; }
  if (a==="t-add"){ if (ui.timer) ui.timer.end += 30000; return; }
  if (a==="t-stop"){ ui.timer = null; clearInterval(timerInt); renderTimer(); return; }
  if (a==="to-fb"){ const any = S.draft.items.some(it => it.sets.some(s => s.done)); if (!any){ toast("Spunta almeno una serie fatta, oppure annulla la seduta."); return; } S.draft.stage = "fb"; ui.timer = null; Store.save(); vt(() => { render(); window.scrollTo(0,0); }, "next"); return; }
  if (a==="back-log"){ S.draft.stage = "log"; render(); return; }
  if (a==="abort"){ S.draft = null; Store.save(); render(); toast("Seduta annullata. La scheda resta com'era."); return; }
  if (a==="save-session"){
    const d = S.draft; const res = finishSession(d); S.draft = null;
    ui.summary = res; ui.claude = null; Store.save(); Store.saveSession(res.rec); vt(() => { render(); window.scrollTo(0,0); }, "next"); return;
  }
  if (a==="close-summary"){ vt(() => { ui.summary = null; ui.claude = null; render(); window.scrollTo(0,0); }, "fade"); return; }
  if (a==="ask-claude"){ askClaude(); return; }
  if (a==="stop-claude"){ claudeCtl?.abort(); return; }
  if (a==="apply-claude"){ applyClaude(); return; }
  if (a==="deload"){ S.plan.deloadUntil = addDays(today(), 6); S.plan.lastDeload = today(); S.plan.fatigue = 0; logChange({id:"", name:"Scheda", what:"obiettivo", from:"", to:"settimana di scarico", why:"Metà serie e carichi −10% per 7 giorni per smaltire la fatica accumulata.", src:"tu"}); Store.save(); render(); return; }
  if (a==="intent"){ S.intent = {d:$("#int-d").value || nextPlannedDay(), t:$("#int-t").value || "18:30", w:$("#int-w").value.slice(0,80)}; Store.save(); render(); toast("Appuntamento fissato."); return; }
  if (a==="swap-plan"){ const id = b.dataset.id; const ses = S.plan.sessions.find(s => s.items.includes(id)); const nid = altFor(id, S.profile.limits, ses?ses.items:[]);
    if (!nid){ toast("Nessuna alternativa disponibile con la tua attrezzatura."); return; } replaceEx(id, nid, "Sostituito da te.", "tu"); Store.save(); render(); toast(`${LIB[nid].n} al posto di ${LIB[id].n}.`); return; }
  if (a==="add-bw"){ const v = Number(String($("#bw-in").value).replace(",", ".")); if (!(v>=35 && v<=250)){ toast("Inserisci un peso tra 35 e 250 kg."); return; }
    S.body = S.body.filter(x => x.d!==today()); S.body.push({d:today(), kg:v}); S.body.sort((x,y) => x.d.localeCompare(y.d)); S.body = S.body.slice(-400); Store.save(); render(); toast("Peso registrato."); return; }
  if (a==="edit-profile"){ ui.ob = JSON.parse(JSON.stringify(S.profile)); ui.step = 1; ui.editing = true; vt(() => { render(); window.scrollTo(0,0); }, "next"); return; }
  if (a==="export"){ const filename = `scheda-viva-${today()}.json`, data = JSON.stringify({profilo:S.profile, scheda:S.plan, corpo:S.body, sedute:SESS}, null, 2);
    if (ui.downloads){ try { await ui.downloads.save({filename, data}); } catch(e){ if (e?.code!=="cancelled") toast("Esportazione non completata."); } return; }
    const url = URL.createObjectURL(new Blob([data], {type:"application/json"})); const l = document.createElement("a"); l.href = url; l.download = filename; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); return; }
  if (a==="wipe-ask"){ ui.wipeAsk = true; render(); return; }
  if (a==="wipe-no"){ ui.wipeAsk = false; render(); return; }
  if (a==="wipe-yes"){ ui.wipeAsk = false; await Store.wipe(); S = null; SESS = []; ui.ob = null; ui.step = 0; render(); toast("Tutti i dati sono stati cancellati."); return; }
});

/* ================= Navigazione ================= */
function route(){
  const h = location.hash.replace("#","");
  ui.route = TABS.some(t => t[0]===h) ? h : "oggi";
  if (S && S.plan) render();
}
window.addEventListener("hashchange", () => { vt(() => { route(); window.scrollTo(0,0); }, "fade"); });

function hideSplash(){ const el = $("#splash"); if (!el) return; el.classList.add("out"); setTimeout(() => el.remove(), 500); }
(async function boot(){
  const t0 = Date.now(); let seen = false;
  try { seen = sessionStorage.getItem("sv-splash")==="1"; sessionStorage.setItem("sv-splash","1"); } catch(e){}
  if (seen || matchMedia("(prefers-reduced-motion: reduce)").matches) $("#splash")?.remove();
  else setTimeout(hideSplash, 4000);
  await Store.init();
  setTimeout(hideSplash, Math.max(0, 1250 - (Date.now()-t0)));
  const h = location.hash.replace("#","");
  ui.route = TABS.some(t => t[0]===h) ? h : "oggi";
  render();
})();
